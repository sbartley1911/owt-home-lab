services:
  broker:
    image: dhi.io/redis:${REDIS_VERSION:-8}
    container_name: paperless-redis
    restart: unless-stopped
    # The DHI config runs protected-mode with no password, which refuses the webserver;
    # a password is required instead. Use a URL-safe value (it is also in PAPERLESS_REDIS).
    command:
      - "redis-server"
      - "/etc/redis/redis.conf"
      - "--requirepass"
      - "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}"
    # dhi.io/redis runs as non-root and cannot read the old redis:8 volume (dump.rdb owned
    # by uid 999), so the broker gets a new volume. It only holds the task queue.
    volumes:
      - paperless_broker_data:/data
    security_opt:
      - no-new-privileges:true
    networks:
      - paperless-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  gotenberg:
    image: docker.io/gotenberg/gotenberg:8.27
    container_name: paperless-gotenberg
    restart: unless-stopped
    command:
      - "gotenberg"
      - "--chromium-disable-javascript=true"
      - "--chromium-allow-list=file:///tmp/.*"
    security_opt:
      - no-new-privileges:true
    networks:
      - paperless-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  tika:
    image: docker.io/apache/tika:${TIKA_VERSION:-3.3.1.0}
    container_name: paperless-tika
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - paperless-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  webserver:
    image: ghcr.io/paperless-ngx/paperless-ngx:${PAPERLESS_VERSION:-3.4.2}
    container_name: paperless-webserver
    restart: unless-stopped
    depends_on:
      - broker
      - gotenberg
      - tika
    ports:
      - "${PAPERLESS_BIND_IP:-127.0.0.1}:${PAPERLESS_PORT:-8000}:8000"
    volumes:
      - paperless_data:/usr/src/paperless/data
      - ${MEDIA_PATH:-/mnt/nfs/appdata/paperless-ngx/media}:/usr/src/paperless/media
      - ${EXPORT_PATH:-/mnt/nfs/appdata/paperless-ngx/export}:/usr/src/paperless/export
      - ${CONSUME_PATH:-/mnt/nfs/appdata/paperless-ngx/consume}:/usr/src/paperless/consume
    environment:
      USERMAP_UID: "9000"
      USERMAP_GID: "0"
      PAPERLESS_TIME_ZONE: America/Chicago
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_REDIS: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@broker:6379
      # Database: external Postgres (CloudNativePG or equivalent), reached on its service address.
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: ${PAPERLESS_DBHOST:?PAPERLESS_DBHOST must be set}
      PAPERLESS_DBPORT: ${PAPERLESS_DBPORT:-5432}
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: ${DB_PASSWORD:?DB_PASSWORD must be set}
      PAPERLESS_DB_OPTIONS: ${PAPERLESS_DB_OPTIONS:-sslmode=require}
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:?PAPERLESS_SECRET_KEY must be set}
      PAPERLESS_ADMIN_USER: ${PAPERLESS_ADMIN_USER:-admin}
      PAPERLESS_ADMIN_PASSWORD: ${PAPERLESS_ADMIN_PASSWORD:?PAPERLESS_ADMIN_PASSWORD must be set}
      PAPERLESS_ADMIN_MAIL: ${PAPERLESS_ADMIN_MAIL:-}
      PAPERLESS_URL: ${PAPERLESS_URL:-}
      PAPERLESS_TIKA_ENABLED: 1
      PAPERLESS_TIKA_GOTENBERG_ENDPOINT: http://gotenberg:3000
      PAPERLESS_TIKA_ENDPOINT: http://tika:9998
      PAPERLESS_FILENAME_FORMAT: '{{ document_type }}/{{ correspondent }}/{{ created_year }}/{{ created_year }}-{{ created_month }}-{{ created_day }}_{{ title|replace(" ", "_") }}'
      PAPERLESS_FILENAME_FORMAT_REMOVE_NONE: "true"
      PAPERLESS_CONSUMER_POLLING_INTERVAL: "10"
      PAPERLESS_CONSUMER_RECURSIVE: "true"
      PAPERLESS_CONSUMER_SUBDIRS_AS_TAGS: "true"
      PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
    security_opt:
      - no-new-privileges:true
    networks:
      - paperless-network
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  paperless-network:
    driver: bridge

volumes:
  paperless_broker_data:
  paperless_data:
