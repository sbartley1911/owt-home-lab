---
apiVersion: v1
kind: Namespace
metadata:
  name: openbrain
  labels:
    app.kubernetes.io/part-of: openbrain
    # Enforce the `restricted` Pod Security Standard. Every pod here runs
    # non-root, no privilege escalation, drop-ALL caps, seccomp RuntimeDefault,
    # and mounts only restricted-allowed volume types (the drop folder is a PVC,
    # not an inline nfs volume, for that reason).
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
