---
# OpenBrain consume-folder ingester (code: ../ingester/ingest.py).
# A dedicated pod rather than an automation-platform workflow: a hardened n8n
# (no Execute Command / Local File Trigger / Read-Write File nodes, no fs in the
# Code node) can't touch a drop folder. This pod owns the filesystem side and
# writes to the same OpenBrain Postgres the capture path uses.
#
# Secret `openbrain-consume-secrets` (DATABASE_URL, OPENAI_API_KEY) is created
# out-of-band from your secret manager and is NOT committed; give the ingester
# its own OpenAI key (see ../ingester/README.md). Code is mounted from ConfigMap
# `openbrain-consume-code`:
#   kubectl create configmap openbrain-consume-code -n openbrain \
#     --from-file=ingest.py=ingester/ingest.py --dry-run=client -o yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openbrain-consume
  namespace: openbrain
  labels:
    app: openbrain-consume
spec:
  replicas: 1
  strategy:
    type: Recreate                 # single poller; never two racing on the folder
  selector:
    matchLabels:
      app: openbrain-consume
  template:
    metadata:
      labels:
        app: openbrain-consume
    spec:
      # Singleton with crash-safe work claiming; reschedule ~1.5 min after node
      # loss instead of the default ~6.
      tolerations:
        - { key: node.kubernetes.io/not-ready, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
        - { key: node.kubernetes.io/unreachable, operator: Exists, effect: NoExecute, tolerationSeconds: 30 }
      securityContext:
        # Match the uid/gid that owns the drop folder, so files dropped from
        # another host and the pod's own moves share one identity and the
        # folder can stay owner-writable (not world-writable).
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: ingester
          image: python:3.12-slim
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          # Runtime pip install; psycopg[binary] bundles libpq. Bake an image to
          # drop the startup install if you have a registry.
          command: ["sh", "-c"]
          args:
            - "pip install --no-cache-dir --target=/tmp/deps 'psycopg[binary]==3.2.*' requests && PYTHONPATH=/tmp/deps exec python -u /app/ingest.py"
          env:
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openbrain-consume-secrets
                  key: DATABASE_URL
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openbrain-consume-secrets
                  key: OPENAI_API_KEY
            - name: POLL_SECONDS
              value: "10"
            - name: SETTLE_SECONDS
              value: "5"
            - name: ARCHIVE_RETAIN_DAYS
              value: "30"
            - name: TIKA_URL
              value: http://tika:9998
            - name: GOTENBERG_URL
              value: http://gotenberg:3000
          volumeMounts:
            - name: consume
              mountPath: /data/consume
            - name: app
              mountPath: /app
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi           # headroom for parsing larger PDFs/Word docs
      volumes:
        - name: consume
          persistentVolumeClaim:
            claimName: ingest       # 05-ingest-pv-pvc.yaml
        - name: app
          configMap:
            name: openbrain-consume-code
