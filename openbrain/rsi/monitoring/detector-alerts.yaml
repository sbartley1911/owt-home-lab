# PrometheusRule for the defect detector. Set the release label to whatever your
# Prometheus ruleSelector matches, and replace the placeholders.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: rsi-detector
  namespace: monitoring
  labels:
    release: REPLACE_WITH_PROMETHEUS_RELEASE
spec:
  groups:
    - name: openbrain-rsi-detector
      rules:
        - alert: OpenBrainRSIDetectorFailed
          expr: |
            max by (workflow_id) (cnpg_rsi_detector_latest_failed{namespace="n8n"}) == 1
            or
            (time() - max by (workflow_id) (cnpg_rsi_detector_last_failure_timestamp{namespace="n8n"})) < 300
          labels:
            severity: critical
            namespace: n8n
            service: openbrain-rsi
          annotations:
            summary: OpenBrain defect detector execution failed
            description: "An automatic detector run failed, crashed, or was canceled. Inspect its n8n execution history. A successful run clears the alert after the five-minute failure visibility window."
            runbook_url: "https://<your-n8n-host>/workflow/REPLACE_WITH_DETECTOR_WORKFLOW_ID"
        - alert: OpenBrainRSIDetectorOverdue
          expr: |
            time() - max by (workflow_id) (cnpg_rsi_detector_last_success_timestamp{namespace="n8n"}) > 93600
          for: 15m
          labels:
            severity: warning
            namespace: n8n
            service: openbrain-rsi
          annotations:
            summary: OpenBrain defect detector has no successful run in 26 hours
            description: "The daily scan is overdue. Check workflow publication, n8n workers, and database connectivity. The allowance covers a 25-hour daylight-saving day."
            runbook_url: "https://<your-n8n-host>/workflow/REPLACE_WITH_DETECTOR_WORKFLOW_ID"
        - alert: OpenBrainRSIDetectorTelemetryMissing
          expr: absent(cnpg_rsi_detector_latest_failed{namespace="n8n",workflow_id="REPLACE_WITH_DETECTOR_WORKFLOW_ID"})
          for: 5m
          labels:
            severity: warning
            namespace: n8n
            service: openbrain-rsi
          annotations:
            summary: OpenBrain defect detector health metrics are missing
            description: "Prometheus cannot read the detector health metric. Check the CNPG primary, the exporter grants, the rsi-detector-monitoring ConfigMap, and the PodMonitor."
            runbook_url: "https://<your-n8n-host>/workflow/REPLACE_WITH_DETECTOR_WORKFLOW_ID"
